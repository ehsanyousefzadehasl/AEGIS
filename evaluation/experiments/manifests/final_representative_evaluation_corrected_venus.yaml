version: 1

experiment_name: final_representative_evaluation
repetitions: 1

runner:
  base_config: config.yaml
  results_dir: evaluation/experiments/results
  delay_scale: 1.0
  startup_wait_s: 10
  eval_idle_exit_minutes: 5
  run_timeout_minutes: 1440

traces:
  - name: venus
    csv: evaluation/experiments/traces/representative/venus_seed42_60jobs.execution.csv

configurations:
  - label: aegis_faketensor
    policy: EST-MAGM
    estimator: faketensor

  - label: aegis_gpumemnet
    policy: EST-MAGM
    estimator: GPUMemNet