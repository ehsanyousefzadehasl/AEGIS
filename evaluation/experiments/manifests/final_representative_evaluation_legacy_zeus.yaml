version: 1
experiment_name: final_representative_evaluation_legacy_zeus
repetitions: 1

runner:
  base_config: evaluation/experiments/configs/legacy_rtx2080ti_memory_only.yaml
  results_dir: evaluation/experiments/results
  delay_scale: 1.0
  startup_wait_s: 10
  eval_idle_exit_minutes: 30
  run_timeout_minutes: 1440

traces:
  - name: saturn_legacy
    csv: evaluation/experiments/traces/legacy_rtx2080ti/mapper_outputs/saturn_legacy_rtx2080ti_seed42_60jobs.execution.csv

configurations:
  - label: exclusive
    policy: exclusive
    estimator: None
  - label: aegis_estimator_free
    policy: OR-MAGM
    estimator: None
  - label: aegis_horus
    policy: EST-MAGM
    estimator: horus
  - label: horus_baseline
    policy: HORUS
    estimator: horus
  - label: lucid_baseline
    policy: LUCID
    estimator: None
  - label: oracle_upper_bound
    policy: oracle-MAGM
    estimator: None
