version: 1

experiment_name: final_representative_evaluation_or_placement_sensitivity
repetitions: 1

runner:
  base_config: config.yaml
  results_dir: evaluation/experiments/results
  delay_scale: 1.0
  startup_wait_s: 10
  eval_idle_exit_minutes: 5
  run_timeout_minutes: 1440

traces:
  - name: philly
    csv: evaluation/experiments/traces/representative/philly_seed42_60jobs.execution.csv

  - name: venus
    csv: evaluation/experiments/traces/representative/venus_seed42_60jobs.execution.csv

  - name: saturn
    csv: evaluation/experiments/traces/representative/saturn_seed42_60jobs.execution.csv

configurations:
  - label: exclusive
    policy: exclusive
    estimator: None

  - label: or_magm
    policy: OR-MAGM
    estimator: None

  - label: or_rr
    policy: OR-RR
    estimator: None

  - label: or_lug
    policy: OR-LUG
    estimator: None
