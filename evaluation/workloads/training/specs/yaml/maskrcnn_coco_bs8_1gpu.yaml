version: 1

job:
  conda_env: tf
  command: >
    python evaluation/workloads/training/scripts/clean/run_maskrcnn_coco.py
    --data_path /raid/datasets/coco
    --epochs 1
    --batch_size 8
    --model maskrcnn_resnet50_fpn
    --output_dir runs

resources:
  num_gpus: 1
  gpu_memory_requirement_mib: 28606

estimates:
  horus_mib: 7902.3
  faketensor_mib: 40000
  gpumemnet_mib: 8000

profile:
  peak_memory_mib: null
  avg_smact: null
  avg_smocc: null
  avg_drama: null
  profiling_duration_s: null
  source: null
  extra_metrics: {}

online_estimation:
  summary_path: maskrcnn.model
  parser_arg_1: coco
  parser_arg_2: 8